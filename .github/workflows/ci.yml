name: Node.js CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Завантаження коду репозиторію в CI-середовище
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок 2: Установлення та налаштування Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # або версія, що використовується у проєкті

      # Крок 3: Встановлення залежностей проєкту
      - name: Install dependencies
        run: npm install

      # Крок 4: Запуск білд-процесу та перевірка на помилки
      - name: Run build process
        run: npm run build

      # Крок 5: Збереження результату білду (артефакту)
      # Додає можливість завантажити зібрані файли у вкладці Actions
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            dist/
            build/
            index.js
            package.json
          if-no-files-found: warn